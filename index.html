<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ars — Systems software developer. Terminal tools, media players and Linux utilities.">
  <meta name="theme-color" content="#0e0b09">
  <title>Ars — Systems Software Developer</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/198413795?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/components/layout.css">
  <link rel="stylesheet" href="src/css/components/hero.css">
  <link rel="stylesheet" href="src/css/components/sections.css">
</head>
<body>
  <header class="nav">
    <div class="container">
      <a class="brand" href="#about">Ars-<span>Byte</span></a>
      <ul class="nav-links">
        <li><a href="#about" data-t="about"></a></li>
        <li><a href="#projects" data-t="work"></a></li>
        <li><a href="#social" data-t="contact"></a></li>
      </ul>
      <div class="nav-actions">
        <button id="lang-toggle" class="icon-btn" aria-label="Language">EN</button>
        <a class="btn btn-ghost btn-sm" href="https://github.com/Ars-byte" target="_blank" rel="noopener">GitHub <i class="fa-solid fa-arrow-right"></i></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="about" class="section view">
      <div id="about-body"></div>
    </section>

    <section id="projects" class="section view">
      <p class="eyebrow reveal" data-t="work"></p>
      <h2 class="section-title reveal" data-t="featured"></h2>
      <div id="featured" class="featured"></div>
      <a class="more-link reveal" href="https://github.com/Ars-byte?tab=repositories" target="_blank" rel="noopener"><span data-t="all"></span> →</a>
    </section>

    <section id="social" class="section contact view">
      <p class="eyebrow reveal" data-t="contact"></p>
      <h2 class="section-title reveal" data-t="contactTitle"></h2>
      <p class="contact-text reveal" data-t="contactText"></p>
      <div id="socials" class="socials reveal"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span>© <span id="year"></span> Ars-byte</span>
      <span>Buenos Aires, AR</span>
    </div>
  </footer>

  <script src="src/data/content.js"></script>
  <script src="src/js/counter.js"></script>
  <script src="src/js/components.js"></script>
  <script src="src/js/matrix.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
